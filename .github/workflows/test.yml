name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl playwright
      - run: npm test
      # docs/ がソースから作り直したものと一致しているか（手で直していない・ビルドし忘れていないか）
      - run: npm run build:app && git diff --exit-code -- docs
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e.py
