# 潜水現場記録の共有 API（Cloudflare Workers ＋ D1）
# アプリ本体は GitHub Pages。ここは記録を預かる API だけ。
name = "diveops-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# アプリを開いてよい場所（CORS）。カンマ区切り
ALLOWED_ORIGINS = "https://daichiokuhira.github.io"
# 1回の送信で受け付ける件数（無料プランは5。有料プランなら50などに増やせる）
CHANGES_PER_REQUEST = "5"

[[d1_databases]]
binding = "DB"
database_name = "diveops"
database_id = "249acfc5-f6a0-4893-9103-1f706d9d28ce"

# 秘密の値は wrangler secret put で入れる（ここには書かない）
#   TEAM_PASSCODE  … 隊共通のパスコード（12文字以上）
#   SECRET_KEY     … ログインの証明に使う鍵（長い乱数）
#   ADMIN_IDS      … 管理者の職員番号（カンマ区切り。公開リポジトリに書かないため secret にする）
#   ADMIN_PASSCODE … 管理者だけのパスコード（任意。入れると、管理者は隊共通のパスコードでは入れない）
